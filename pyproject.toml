[project]
name = "ha-house-map"
version = "0.0.0"
description = "Home Assistant integration: place devices on floor plan SVGs"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
