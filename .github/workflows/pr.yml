name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    uses: FroeFam/ci-pipeline/.github/workflows/build-test.yml@v1
    with:
      language: python
      python-version: '3.14'
      python-matrix: '["3.14"]'
      package-manager: uv
      format-command: 'uv run --locked ruff format --check .'
    secrets: inherit

  # Repo-specific checks, folded into the required "Build and test" context.
  frontend:
    name: frontend bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/house_map/frontend

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-11-14

  review:
    uses: FroeFam/ci-pipeline/.github/workflows/claude-review.yml@v1
    secrets: inherit

  check-build:
    name: Build and test
    needs: [build, frontend, hassfest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        shell: pwsh
        run: |
          foreach ($r in '${{ needs.build.result }}', '${{ needs.frontend.result }}', '${{ needs.hassfest.result }}') {
            if ($r -notin 'success','skipped') { exit 1 }
          }

  check-review:
    name: Review with Claude
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check review result
        shell: pwsh
        run: if ('${{ needs.review.result }}' -notin 'success','skipped') { exit 1 }
